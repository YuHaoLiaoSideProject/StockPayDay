# StockPayDay++ 自動化：爬蟲 → 處理 → 建構前端 → 部署 GitHub Pages
# 觸發時機：push 到 master / 每日排程 / 手動
#
# 注意：push 觸發時「不執行爬蟲」，直接以 repo 內的 data/ 重建 api/ 後部署；
#       只有每日排程或手動勾選 run_crawler 才會爬新資料。
name: Update Dividend Data

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.githooks/**'
      - '.github/workflows/ci.yml'
  schedule:
    - cron: '0 8 * * *'          # 每日 UTC 08:00（台北時間 16:00）
  workflow_dispatch:
    inputs:
      run_crawler:
        description: '是否執行爬蟲'
        required: false
        default: false
        type: boolean

# 防止同一 workflow 並發執行
concurrency:
  group: update-dividend
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 爬蟲後 commit data/ 回 repo 需要寫入權限
    timeout-minutes: 20

    steps:
      # ─── Step 1: Checkout 專案 ───
      - name: Checkout
        uses: actions/checkout@v4

      # ─── Step 2: 設定 Python 環境 ───
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ─── Step 3: 安裝 Python 依賴 ───
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ─── Step 4: 執行爬蟲（僅 cron 或手動勾選時） ───
      # 預設指令 = MoneyDJ 全市場除權除息 + 上市/上櫃證券清單（搜尋索引需要）
      - name: Run crawler
        if: github.event_name == 'schedule' || inputs.run_crawler == true
        run: python crawler/fetch.py

      # ─── Step 4b: 爬蟲後把 data/ commit 回 repo ───
      # 讓之後的 push 觸發部署也能直接使用 repo 內資料（不需重爬）
      - name: Commit crawled data
        if: github.event_name == 'schedule' || inputs.run_crawler == true
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "✅ data/ 無變更，跳過 commit"
          else
            git commit -m "data: 線上重新爬取（$(date -u +%Y-%m-%d)）"
            git push
            echo "📤 data/ 已 commit 並 push 回 master"
          fi

      # ─── Step 4c: push 且 repo 無 data/ 時直接失敗 ───
      # 避免用空資料部署出空站（搜尋索引 0 筆）
      - name: Check data exists
        if: github.event_name == 'push'
        run: |
          if [ ! -d "data" ] || [ -z "$(ls -A data 2>/dev/null)" ]; then
            echo "::error::repo 內沒有 data/。請先手動觸發本 workflow 並勾選 run_crawler=True，線上爬蟲會重建並 commit data/ 回 repo。"
            exit 1
          fi

      # ─── Step 5: 執行處理器 ───
      - name: Run processor
        run: python processor/generate_api.py

      # ─── Step 6: 設定 Node.js 環境 ───
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ─── Step 7: 安裝前端依賴 ───
      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # ─── Step 8: 建構前端 ───
      - name: Build frontend
        run: cd frontend && npm run build

      # ─── Step 9: 組裝部署目錄 ───
      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp -r frontend/dist/* _site/
          # 只有 api/ 存在時才複製
          if [ -d "api" ] && [ "$(ls -A api 2>/dev/null)" ]; then
            cp -r api _site/
          else
            echo "⚠️ api/ 目錄不存在或為空，跳過複製"
          fi

      # ─── Step 10: 部署至 GitHub Pages ───
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
