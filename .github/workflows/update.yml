# StockPayDay++ 每日自動化：爬蟲 → 處理 → 建構前端 → 部署
name: Update Dividend Data

on:
  schedule:
    - cron: '0 8 * * *'          # 每日 UTC 08:00（台北時間 16:00）
  workflow_dispatch:
    inputs:
      run_crawler:
        description: '是否執行爬蟲'
        required: false
        default: false
        type: boolean

# 防止同一 workflow 並發執行
concurrency:
  group: update-dividend
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ─── Step 1: Checkout 專案 ───
      - name: Checkout
        uses: actions/checkout@v4

      # ─── Step 2: 設定 Python 環境 ───
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ─── Step 3: 安裝 Python 依賴 ───
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ─── Step 4: 執行爬蟲（僅 cron 或手動勾選時） ───
      - name: Run crawler
        if: github.event_name == 'schedule' || inputs.run_crawler == true
        run: python crawler/fetch.py

      # ─── Step 5: 執行處理器 ───
      - name: Run processor
        run: python processor/generate_api.py

      # ─── Step 6: 設定 Node.js 環境 ───
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ─── Step 7: 安裝前端依賴 ───
      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # ─── Step 8: 建構前端 ───
      - name: Build frontend
        run: cd frontend && npm run build

      # ─── Step 9: 組裝部署目錄 ───
      # 參考 AirTicketsPrice 模式：frontend/dist + api/ 合併到 _site/
      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp -r frontend/dist/* _site/
          # 只有 api/ 存在時才複製
          if [ -d "api" ] && [ "$(ls -A api 2>/dev/null)" ]; then
            cp -r api _site/
          else
            echo "⚠️ api/ 目錄不存在或為空，跳過複製"
          fi

      # ─── Step 10: 部署至 GitHub Pages ───
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
