<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>StockPayDay++</title>
  <script>
    // GitHub Pages SPA fallback：將路徑轉換為 hash 傳給 index.html
    // 例如: /StockPayDay/app → /StockPayDay/#/app
    var pathSegmentsToKeep = 1; // 保留 /StockPayDay/
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
